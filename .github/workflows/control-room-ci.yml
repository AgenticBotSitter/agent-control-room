name: Control Room CI

on:
  pull_request:
    branches:
      - main
      - "integration/**"
      - "codex/**"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: control-room-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Control Room
        uses: ./.github/actions/prepare-control-room

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

  tests:
    name: Test ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane:
          - pre
          - main-1
          - main-2
          - main-3
          - main-4
          - post
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Control Room
        uses: ./.github/actions/prepare-control-room

      - name: Run test lane
        run: node scripts/run-ci-test-lane.mjs --lane ${{ matrix.lane }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Control Room
        uses: ./.github/actions/prepare-control-room

      - name: Build and verify rendered routes
        run: pnpm test:build

      - name: Build and verify private VPS application
        run: pnpm test:build:vps

      - name: Verify database migrations
        run: pnpm db:verify

  verify:
    name: Verify build
    runs-on: ubuntu-latest
    needs:
      - checks
      - tests
      - build
    if: ${{ always() }}
    steps:
      - name: Require every CI lane to succeed
        shell: bash
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          [[ "$CHECKS_RESULT" == "success" ]]
          [[ "$TESTS_RESULT" == "success" ]]
          [[ "$BUILD_RESULT" == "success" ]]
