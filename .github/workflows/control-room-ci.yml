name: Control Room CI

on:
  pull_request:
    branches:
      - main
      - "integration/**"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: control-room-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Run dependency-free readiness probe
        run: node scripts/qualification/platform-key-store-stage-zero.mjs --platform linux

      - name: Install frozen dependencies
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Confirm prepared checkout
        run: node scripts/qualification/platform-key-store-stage-zero.mjs --platform linux

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Run full test lifecycle
        run: pnpm test

      - name: Build and verify rendered routes
        run: pnpm test:build

      - name: Verify database migrations
        run: pnpm db:verify
