name: Automatic job claim

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Read-only pull-request access: submit verifies the open PR binding and the
  # sweep/release paths check for open PRs. No merge or review authority.
  pull-requests: read

concurrency:
  # A short repository-wide critical section serializes every claim lifecycle
  # command so two workers cannot reserve, renew, submit or release at once.
  # queue: max preserves pending requests behind the running one instead of
  # replacing them; the review-handoff workflow shares this same group.
  group: automatic-job-claim-${{ github.repository_id }}
  cancel-in-progress: false
  queue: max

jobs:
  claim:
    # Run for any comment that contains a lifecycle command. The controller
    # still accepts only the exact two/four-line grammar; broader routing lets
    # it post an immediate format error instead of silently skipping a command
    # hidden below prose or an HTML marker.
    if: ${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && (contains(github.event.comment.body, 'CLAIM REQUEST') || contains(github.event.comment.body, 'CLAIM RENEW') || contains(github.event.comment.body, 'CLAIM SUBMIT') || contains(github.event.comment.body, 'CLAIM RELEASE')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate and apply one claim lifecycle command
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/automatic-claim-controller.mjs
  sweep:
    # Manual expiry sweep: expired Working claims return to Ready, stay In
    # review behind an open pull request, or become Needs decision. The same
    # sweep also runs piggybacked on every claim command above.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Sweep expired Working claims
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/automatic-claim-controller.mjs --sweep
