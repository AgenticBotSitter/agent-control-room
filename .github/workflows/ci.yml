  full-mac-local-rehearsal:
    name: Full Mac-local rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # PGDG installs versioned binaries outside Ubuntu's default PATH.
      PG_BIN: /usr/lib/postgresql/17/bin
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install PostgreSQL 17 from PGDG
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --silent --show-error --location --output /tmp/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test -s /tmp/pgdg.asc
          head -1 /tmp/pgdg.asc | grep -q "BEGIN PGP PUBLIC KEY BLOCK"
          sudo cp /tmp/pgdg.asc /etc/apt/keyrings/pgdg.asc
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release --short --codename)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17
      - name: Build the production application
        run: pnpm build
      - name: Test Mac task host recovery
        run: pnpm test:mac-host-supervisor
      - name: Run both supported full journeys with pinned fakes
        run: |
          set -euo pipefail
          rehearsal_root=""
          rehearsal_port=""
          cleanup() {
            if [ -n "${rehearsal_root}" ] && [ -d "${rehearsal_root}" ]; then
              pnpm mac:rehearsal down "${rehearsal_root}" --port "${rehearsal_port}" --fake-executables || true
              rm -rf -- "${rehearsal_root}"
            fi
          }
          trap cleanup EXIT INT TERM
          run_rehearsal() {
            mode="$1"
            database_port="$2"
            web_port="$3"
            rehearsal_port="${database_port}"
            rehearsal_root="$(mktemp -d "${RUNNER_TEMP}/mac-local-rehearsal.XXXXXX")"
            pnpm mac:rehearsal up "${rehearsal_root}" --port "${database_port}" --web-port "${web_port}" --fake-executables
            CONTROL_ROOM_MAC_REHEARSAL_ROOT="${rehearsal_root}" node --import tsx --test --test-reporter=tap tests/mac-local-pg17-rehearsal.test.mjs | tee "${rehearsal_root}/pg17-negative-probes.tap"
            if grep -Eq '^# skipped [1-9][0-9]*$' "${rehearsal_root}/pg17-negative-probes.tap"; then
              echo "PG17 negative privilege probes reported a TAP skip" >&2
              exit 1
            fi
            pnpm mac:prepare-task-runtime -- \
              --protected-root "${rehearsal_root}/protected" \
              --hermes-profile cr \
              --hermes-provider opencode-go \
              --hermes-model space-bunny-free \
              --hermes-destination https://opencode.ai:443
            if [ -n "${mode}" ]; then
              node --import tsx scripts/mac-local/rehearsal/journey.ts "${rehearsal_root}" "${mode}"
            else
              node --import tsx scripts/mac-local/rehearsal/journey.ts "${rehearsal_root}"
            fi
            rm -rf -- "${rehearsal_root}"
            rehearsal_root=""
            rehearsal_port=""
          }
          echo "::notice::launchd installation is macOS-only; this Linux rehearsal uses mac:up's documented detached-host path."
          run_rehearsal "" 15499 3217
          if grep -q -- "--model-allowlists" scripts/mac-local/rehearsal/journey.ts; then
            run_rehearsal "--model-allowlists" 15500 3218
          else
            echo "::notice::model-allowlists journey is not present on this pre-#365 revision; the default journey passed and stacked revisions must run both modes."
          fi

  owner-browser-journey:
    name: Owner browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PG_BIN: /usr/lib/postgresql/17/bin
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium for the CI journey only
        run: pnpm exec playwright install --with-deps chromium
      - name: Install PostgreSQL 17 from PGDG
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --silent --show-error --location --output /tmp/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test -s /tmp/pgdg.asc
          head -1 /tmp/pgdg.asc | grep -q "BEGIN PGP PUBLIC KEY BLOCK"
          sudo cp /tmp/pgdg.asc /etc/apt/keyrings/pgdg.asc
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release --short --codename)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17
      - name: Build and run the owner browser suites
        run: |
          set -euo pipefail
          rehearsal_root=""
          rehearsal_port=""
          rehearsal_web_port=""
          cleanup_current() {
            if [[ -n "${rehearsal_root}" ]]; then
              pnpm mac:rehearsal down "${rehearsal_root}" --port "${rehearsal_port}" \
                --web-port "${rehearsal_web_port}" --fake-executables || true
              rm -rf -- "${rehearsal_root}"
              rehearsal_root=""
            fi
          }
          run_browser_suite() {
            local mode="$1"
            rehearsal_port="$2"
            rehearsal_web_port="$3"
            rehearsal_root="$(mktemp -d "${RUNNER_TEMP}/owner-browser.XXXXXX")"
            pnpm mac:rehearsal up "${rehearsal_root}" --port "${rehearsal_port}" \
              --web-port "${rehearsal_web_port}" --fake-executables
            pnpm mac:prepare-task-runtime -- \
              --protected-root "${rehearsal_root}/protected" \
              --hermes-profile cr \
              --hermes-provider opencode-go \
              --hermes-model space-bunny-free \
              --hermes-destination https://opencode.ai:443
            node --import tsx scripts/mac-local/rehearsal/journey.ts "${rehearsal_root}" "${mode}"
            cleanup_current
          }
          trap cleanup_current EXIT INT TERM
          pnpm build
          run_browser_suite --browser-owner-e2e 15501 3219
          run_browser_suite --browser-adversarial-e2e 15502 3220
          # Phone-width usability (M12). A third disposable stack on its own
          # port pair, so the measurement never shares state with the journey
          # above it — the test signs in as the owner and creates its own
          # project and task. It is a separate suite in the existing
          # owner-browser-journey job rather than a new job or workflow, so
          # this adds no runner, no new required check, and no new artifact.
          run_browser_suite --browser-phone-width-e2e 15503 3221
      # NOTE: there is deliberately no "capture owner page screenshots" step
      # here, and no owner-screenshots artifact upload.
      #
      # An earlier version of this workflow added one that could never run. It
      # referenced `rehearsal_root`, a shell variable set inside the step above,
      # from a separate `run:` block — each step is a fresh shell, so it expanded
      # empty, `mac:rehearsal up ""` exited 2 (setup.ts requires an absolute dir),
      # and the step's `||` branch reported success and skipped the capture on
      # every run. On the path where it did start a cluster, its teardown was
      # `pnpm mac:down`, which stops the app host and never touches pg_ctl, so the
      # disposable PostgreSQL cluster was left running. A permanently-dead step
      # that also leaks a database is worse than no step.
      #
      # Screenshot capture needs a stack that outlives run_browser_suite, which
      # tears each one down (and the trap tears down the last one too). That is
      # a change to the rehearsal harness — a mode that leaves a verified
      # disposable cluster up for an external process to photograph — not to this
      # workflow, and it wants the budget/security review
      # docs/ci-budget-security-review.md calls for. It is not worth shipping a
      # dead step in the meantime, so it is removed rather than left for a
      # reviewer to discover. Re-adding it means adding the harness mode first.
      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owner-browser-failure
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  # Runs exactly the lanes the fast path skipped, so the union of everything that
  # ran is the complete suite. One matrix entry per lane, so a skipped lane is
  # caught up in parallel rather than serialised behind the others.
  full-gate:
    name: Merge gate catch-up
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [demo, server, components, articles]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          # Catch-up steps are intentionally skipped when the corresponding
          # early lane ran. Do not register a cache post-step in that case:
          # there is no pnpm store to save and setup-node treats that as an
          # error, turning a successful no-op catch-up into a failed gate.
      - name: Note which lane this entry covers
        run: |
          echo "Merge-gate entry for lane: ${{ matrix.lane }}" >> "$GITHUB_STEP_SUMMARY"
      # The catch-up components lane needs PostgreSQL 17 for the attack-test kit,
      # exactly like the early components job. Without this the kit's real-cluster
      # tests would skip here and a pull request that routed away from the
      # components lane would still get a green merge gate with none of that
      # coverage. Mirrors the PGDG keyring steps in the early job.
      - name: Install PostgreSQL 17 from PGDG for the components catch-up
        if: ${{ !cancelled() && matrix.lane == 'components' }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --silent --show-error --location --output /tmp/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test -s /tmp/pgdg.asc
          head -1 /tmp/pgdg.asc | grep -q "BEGIN PGP PUBLIC KEY BLOCK"
          sudo cp /tmp/pgdg.asc /etc/apt/keyrings/pgdg.asc
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release --short --codename)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - name: Demo tests (merge gate)
        if: ${{ !cancelled() && matrix.lane == 'demo' && needs.route.result == 'success' && needs.route.outputs.demo == 'false' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:demo
          pnpm run test:build:demo
      - name: Server build tests (merge gate)
        if: ${{ !cancelled() && matrix.lane == 'server' && needs.route.result == 'success' && needs.route.outputs.server == 'false' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test
      - name: Component lanes (merge gate)
        if: ${{ !cancelled() && matrix.lane == 'components' && needs.route.result == 'success' && needs.route.outputs.components == 'false' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:components
          pnpm run test:attack-kit
          node scripts/run-tests-with-quarantine.mjs --import tsx --test tests/resource-bound-native-contract-v2.test.ts tests/resource-bound-codex-contract-v2.test.ts tests/resource-bound-local-start-contract-v2.test.ts
      - name: Article build lane (merge gate)
        if: ${{ !cancelled() && matrix.lane == 'articles' && needs.route.result == 'success' && needs.route.outputs.articles == 'false' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:build:articles

  # The single check that attests to the complete suite having run. It reads no
  # routing decision, so a pull request cannot skip it: the lanes it aggregates
  # either passed or were run here by full-gate.
  merge-gate:
    name: Full suite (merge gate)
    if: ${{ always() }}
    needs: [affected-tests, route, mutation-checks, pr-claims, quick, test-demo, test-server, test-components, test-articles, migration-lint, test-unified-product, full-mac-local-rehearsal, owner-browser-journey, full-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail unless every lane passed or was caught up by the gate
        run: |
          set -euo pipefail
          status=0
          check() {
            case "$2" in
              success|skipped) echo "  $1: $2" ;;
              cancelled)
                echo "  $1: $2"
                echo "::error::${1} runner was lost or cancelled; re-run the workflow"
                status=1
                ;;
              *) echo "  $1: $2"; status=1 ;;
            esac
          }
          echo "Lane results:"
          check affected-tests "${{ needs.affected-tests.result }}"
          check route "${{ needs.route.result }}"
          check mutation-checks "${{ needs.mutation-checks.result }}"
          check pr-claims "${{ needs.pr-claims.result }}"
          check quick "${{ needs.quick.result }}"
          check demo "${{ needs.test-demo.result }}"
          check server "${{ needs.test-server.result }}"
          check components "${{ needs.test-components.result }}"
          check articles "${{ needs.test-articles.result }}"
          check migration-lint "${{ needs.migration-lint.result }}"
          check unified-product "${{ needs.test-unified-product.result }}"
          check full-mac-local-rehearsal "${{ needs.full-mac-local-rehearsal.result }}"
          check owner-browser-journey "${{ needs.owner-browser-journey.result }}"
          check full-gate "${{ needs.full-gate.result }}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::the complete suite did not pass, so this pull request is not merge-ready"
            exit 1
          fi
          echo "Complete suite satisfied for this revision."
