name: CI

# Added under the .gitignore rule "Do not add automation without an explicit
# budget/security review." That review is docs/ci-budget-security-review.md;
# read it before changing anything here.
#
# Budget: this repository is public, so GitHub's standard runners are free for
# it and this workflow draws on no account's included-minutes budget.
#
# Security: this repository is public, so anyone can open a pull request and
# cause this to run. Every step below assumes the checked-out code is hostile.
#  - `pull_request` (never `pull_request_target`) so fork runs get a read-only
#    token and no access to secrets.
#  - `--ignore-scripts` so installing dependencies cannot execute their
#    lifecycle scripts. The tests still run the code; this removes the path that
#    runs it before any test does.
#  - Actions pinned to commit SHAs, because a tag can be moved.
#  - `persist-credentials: false` so no token is left in the git config.
#
# Commits here have historically been marked [skip ci] because no workflow
# existed to run. That convention now suppresses the verification it predates.
# Leave it off.
#
# Every test must be reachable from a command a job below actually runs. The
# `quick` job follows package-script chains from those workflow commands and
# fails on any unregistered top-level or nested test. An unused package script
# cannot satisfy it.
#
# Feedback versus the merge gate: `quick` runs on every pull request and reports
# in about a minute, and the path-aware lanes below run just the lanes the
# changed paths can affect. That fast path never removes coverage. `full-gate`
# runs every lane the fast path skipped, so the union of what runs is always the
# complete suite, and `merge-gate` is the single check that attests to it. The
# merge gate deliberately does not read the routing decision, so nothing a pull
# request controls can skip it. See docs/ci-budget-security-review.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      quick: ${{ steps.route.outputs.quick }}
      demo: ${{ steps.route.outputs.demo }}
      server: ${{ steps.route.outputs.server }}
      components: ${{ steps.route.outputs.components }}
      articles: ${{ steps.route.outputs.articles }}
      full: ${{ steps.route.outputs.full }}
      classes: ${{ steps.route.outputs.classes }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The merge base has to be present for a three-dot diff against the base
          # branch, and a shallow clone does not contain it.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Diagnostics go to the log, never to disk, and no credential is written.
      - name: Map this pull request to a lane set
        id: route
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ]; then
            # A push to main or a manual dispatch has no pull-request base. An
            # unreadable diff routes to the complete suite by design.
            echo "No pull-request base revision; the complete suite is required." >&2
            : > /tmp/changed-paths.txt
          else
            git fetch --no-tags --quiet origin "${BASE_REF}"
            git diff --name-status "origin/${BASE_REF}...HEAD" > /tmp/changed-paths.txt
            echo "Changed paths:" >&2
            cat /tmp/changed-paths.txt >&2
          fi
          node scripts/ci-path-routing.mjs /tmp/changed-paths.txt
      - name: Summarise the routing decision
        # Every value reaches the shell as an environment variable. The outputs are
        # derived from the changed-path list, so a crafted file name must never be
        # interpolated into a command line: `${{ }}` inside `run:` would execute it.
        env:
          CLASSES: ${{ steps.route.outputs.classes }}
          FULL: ${{ steps.route.outputs.full }}
          DEMO: ${{ steps.route.outputs.demo }}
          SERVER: ${{ steps.route.outputs.server }}
          COMPONENTS: ${{ steps.route.outputs.components }}
          ARTICLES: ${{ steps.route.outputs.articles }}
          REASON: ${{ steps.route.outputs.reason }}
        run: |
          echo "routing reason: ${REASON}"
          {
            echo "### Changed-path routing"
            echo ""
            echo "- Classes: \`${CLASSES}\`"
            echo "- Complete suite required: \`${FULL}\`"
            echo "- Lanes run early: \`demo=${DEMO} server=${SERVER} components=${COMPONENTS} articles=${ARTICLES}\`"
            echo ""
            echo "Every lane not run early is run by \`full-gate\`, so the complete suite still runs before merge."
          } >> "$GITHUB_STEP_SUMMARY"

  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # These two need no dependencies, so they report in seconds, before the
      # install that the type checks require.
      - name: Test the lane coverage checker and the path routing
        run: node --test tests/check-test-lane-coverage.test.mjs tests/ci-path-routing.test.mjs
      - name: Fail if any test file is unreachable from GitHub Actions
        run: node scripts/check-test-lane-coverage.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type check contributor demo
        run: pnpm run check:demo
      - name: Type check server build
        run: pnpm run check

  test-demo:
    name: Contributor demo tests
    needs: route
    # Routing may narrow work, never drop it: whatever is skipped here is run by
    # full-gate. The status function matters: without it a job-level if: inherits an
    # implicit success() of its dependencies, so a failed or cancelled route job would
    # skip this lane. !cancelled() keeps the lane running after a routing failure while
    # still respecting cancellation of a superseded run.
    if: ${{ !cancelled() && (needs.route.result != 'success' || needs.route.outputs.demo != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Demo tests
        run: pnpm run test:demo
      - name: Demo build test
        run: pnpm run test:build:demo

  test-server:
    name: Server build tests
    needs: route
    if: ${{ !cancelled() && (needs.route.result != 'success' || needs.route.outputs.server != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The `test` script builds the server bundle first, so this covers the
      # build as well and there is no separate build job.
      - name: Build and test
        run: pnpm run test

  test-components:
    name: Component lanes
    needs: route
    if: ${{ !cancelled() && (needs.route.result != 'success' || needs.route.outputs.components != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # PostgreSQL 17 for the postgres-production operator tests (chained into
      # test:components). ASCII-armored key: modern apt reads .asc directly,
      # never through gpg --dearmor (which can block on /dev/tty).
      - name: Install PostgreSQL 17 from PGDG
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --silent --show-error --location --output /tmp/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test -s /tmp/pgdg.asc
          head -1 /tmp/pgdg.asc | grep -q "BEGIN PGP PUBLIC KEY BLOCK"
          sudo cp /tmp/pgdg.asc /etc/apt/keyrings/pgdg.asc
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release --short --codename)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17
      # Chains contracts, product shell, notices, database, queue, codex
      # recovery, access, owner signing, checkpoints, ideas, results, articles,
      # calendar, observations, workspaces, native fences, release licenses and
      # the build profile. These cover the security boundaries the
      # configuration contract commits to; none of them ran in CI before.
      - name: Component lanes
        run: pnpm run test:components
      - name: Resource-bound connector contracts
        run: node --import tsx --test tests/resource-bound-native-contract-v2.test.ts tests/resource-bound-codex-contract-v2.test.ts tests/resource-bound-local-start-contract-v2.test.ts

  test-articles:
    name: Article build lane
    needs: route
    if: ${{ !cancelled() && (needs.route.result != 'success' || needs.route.outputs.articles != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Article build lane
        run: pnpm run test:build:articles

  test-unified-product:
    name: Unified local and multi-computer product tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Shared topology and installable product lanes
        run: |
          pnpm run test:unified-topology
          pnpm run test:local-installation
          pnpm run test:local-hermes-admission
      - name: Local adapters, recovery, transitions and product surfaces
        run: |
          node --import tsx --test \
            tests/claude-code-local-delivery-composition.test.ts \
            tests/claude-code-local-executor.test.ts \
            tests/claude-code-local-process-readiness.test.ts \
            tests/claude-code-local-run-registration.test.ts \
            tests/claude-code-private-process-acquisition.test.ts \
            tests/claude-code-session-identity.test.ts \
            tests/claude-code-task-planning.test.ts \
            tests/codex-local-delivery-composition.test.ts \
            tests/controller-worker-delivery-receipt-store.test.ts \
            tests/controller-worker-delivery.test.ts \
            tests/database-relocation-preparation.test.ts \
            tests/hermes-021-completed-task-publication.test.ts \
            tests/hermes-021-delivery-recovery-status.test.ts \
            tests/hermes-021-local-executor.test.ts \
            tests/hermes-021-macos-local-worker.test.ts \
            tests/hermes-021-private-installation-composition.test.ts \
            tests/hermes-021-terminal-result-staging.test.ts \
            tests/hermes-macos-local-session-port.test.ts \
            tests/idea-canonical-synthesis-operation.test.ts \
            tests/idea-lab-canonical-result-projection.test.ts \
            tests/idea-lab-canonical-task-plan.test.ts \
            tests/idea-lab-canonical-task-proposal.test.ts \
            tests/idea-result-projection-route.test.ts \
            tests/idea-round-proposal-client.test.ts \
            tests/idea-round-proposal-operation.test.ts \
            tests/installation-setup-view.test.ts \
            tests/installation-topology-summary.test.tsx \
            tests/installation-transition-store.test.ts \
            tests/installation-transition-summary.test.ts \
            tests/installation-transition.test.ts \
            tests/local-backup-restore-readiness.test.ts \
            tests/local-harness-capabilities.test.ts \
            tests/local-supervisor-readiness-recorder.test.mjs \
            tests/local-supervisor-readiness.test.ts \
            tests/macos-local-service-package.test.ts \
            tests/macos-local-service-preflight-launcher.test.mjs \
            tests/macos-local-service-preflight.test.ts \
            tests/owner-bootstrap-filesystem-lifecycle.test.ts \
            tests/owner-bootstrap-only-host.test.ts \
            tests/qualify-local-hermes-021-script.test.ts \
            tests/remote-session-delivery-bridge.test.ts \
            tests/remote-worker-delivery.test.ts \
            tests/task-assignment-panel.test.tsx \
            tests/three-local-agent-conformance.test.ts \
            tests/worktree-change-audit-authority.test.ts \
            tests/worktree-change-audit-plan-store.test.ts \
            tests/worktree-change-audit-record-store.test.ts \
            tests/worktree-change-audit-record.test.ts \
            tests/worktree-change-audit.test.ts \
            tests/worktree-evidence-web-authorization.test.ts

  # Runs exactly the lanes the fast path skipped, so the union of everything that
  # ran is the complete suite. One matrix entry per lane, so a skipped lane is
  # caught up in parallel rather than serialised behind the others.
  full-gate:
    name: Merge gate catch-up
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [demo, server, components, articles]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Note which lane this entry covers
        run: |
          echo "Merge-gate entry for lane: ${{ matrix.lane }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Demo tests (merge gate)
        if: ${{ !cancelled() && matrix.lane == 'demo' && needs.route.result == 'success' && needs.route.outputs.demo == 'false' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:demo
          pnpm run test:build:demo
      - name: Server build tests (merge gate)
        if: ${{ !cancelled() && matrix.lane == 'server' && needs.route.result == 'success' && needs.route.outputs.server == 'false' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test
      - name: Component lanes (merge gate)
        if: ${{ !cancelled() && matrix.lane == 'components' && needs.route.result == 'success' && needs.route.outputs.components == 'false' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:components
          node --import tsx --test tests/resource-bound-native-contract-v2.test.ts tests/resource-bound-codex-contract-v2.test.ts tests/resource-bound-local-start-contract-v2.test.ts
      - name: Article build lane (merge gate)
        if: ${{ !cancelled() && matrix.lane == 'articles' && needs.route.result == 'success' && needs.route.outputs.articles == 'false' }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:build:articles

  # The single check that attests to the complete suite having run. It reads no
  # routing decision, so a pull request cannot skip it: the lanes it aggregates
  # either passed or were run here by full-gate.
  merge-gate:
    name: Full suite (merge gate)
    if: ${{ always() }}
    needs: [route, quick, test-demo, test-server, test-components, test-articles, test-unified-product, full-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail unless every lane passed or was caught up by the gate
        run: |
          set -euo pipefail
          status=0
          check() {
            case "$2" in
              success|skipped) echo "  $1: $2" ;;
              *) echo "  $1: $2"; status=1 ;;
            esac
          }
          echo "Lane results:"
          check route "${{ needs.route.result }}"
          check quick "${{ needs.quick.result }}"
          check demo "${{ needs.test-demo.result }}"
          check server "${{ needs.test-server.result }}"
          check components "${{ needs.test-components.result }}"
          check articles "${{ needs.test-articles.result }}"
          check unified-product "${{ needs.test-unified-product.result }}"
          check full-gate "${{ needs.full-gate.result }}"
          if [ "${status}" -ne 0 ]; then
            echo "::error::the complete suite did not pass, so this pull request is not merge-ready"
            exit 1
          fi
          echo "Complete suite satisfied for this revision."
