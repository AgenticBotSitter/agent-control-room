name: CI

# Added under the .gitignore rule "Do not add automation without an explicit
# budget/security review." That review is docs/ci-budget-security-review.md;
# read it before changing anything here.
#
# Budget: this repository is public, so GitHub's standard runners are free for
# it and this workflow draws on no account's included-minutes budget.
#
# Security: this repository is public, so anyone can open a pull request and
# cause this to run. Every step below assumes the checked-out code is hostile.
#  - `pull_request` (never `pull_request_target`) so fork runs get a read-only
#    token and no access to secrets.
#  - `--ignore-scripts` so installing dependencies cannot execute their
#    lifecycle scripts. The tests still run the code; this removes the path that
#    runs it before any test does.
#  - Actions pinned to commit SHAs, because a tag can be moved.
#  - `persist-credentials: false` so no token is left in the git config.
#
# Commits here have historically been marked [skip ci] because no workflow
# existed to run. That convention now suppresses the verification it predates.
# Leave it off.
#
# Every test must be reachable from a command a job below actually runs. The
# `quick` job follows package-script chains from those workflow commands and
# fails on any unregistered top-level or nested test. An unused package script
# cannot satisfy it.
#
# Feedback versus the merge gate: `quick` runs on every pull request and reports
# in about a minute, and the path-aware lanes below run just the lanes the
# changed paths can affect. That fast path never removes coverage. `full-gate`
# runs every lane the fast path skipped, so the union of what runs is always the
# complete suite, and `merge-gate` is the single check that attests to it. The
# merge gate deliberately does not read the routing decision, so nothing a pull
# request controls can skip it. See docs/ci-budget-security-review.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected-tests:
    name: Affected tests (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PG_BIN: /usr/lib/postgresql/17/bin
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Calculate affected-test requirements
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/affected-tests.mjs --github-output "${BASE_SHA:-HEAD^}"
      - name: Install PostgreSQL 17 when selected tests require it
        if: ${{ steps.selection.outputs.needs-pg == 'true' }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --silent --show-error --location --output /tmp/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test -s /tmp/pgdg.asc
          head -1 /tmp/pgdg.asc | grep -q "BEGIN PGP PUBLIC KEY BLOCK"
          sudo cp /tmp/pgdg.asc /etc/apt/keyrings/pgdg.asc
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release --short --codename)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
      - name: Prepare the reviewed pre-0086 database-upgrade fixture
        if: ${{ steps.selection.outputs.needs-pg == 'true' }}
        run: |
          set -euo pipefail
          fixture_root="$(mktemp -d "${RUNNER_TEMP}/acr-db-0085.XXXXXX")"
          git archive --format=tar 88941c0414407be5b226c9b1d78fb17c53ec9810 | tar -x -C "${fixture_root}"
          test -f "${fixture_root}/deploy/postgres/migration-ledger.json"
          ! grep -q '0086_mac_local_owner_review_profile' "${fixture_root}/deploy/postgres/migration-ledger.json"
          echo "CONTROL_ROOM_PG17_UPGRADE_FIXTURE_ROOT=${fixture_root}" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL for selected database tests
        if: ${{ steps.selection.outputs.needs-pg == 'true' }}
        run: |
          set -euo pipefail
          postgres_root="$(mktemp -d "${RUNNER_TEMP}/affected-tests-postgres.XXXXXX")"
          postgres_port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          mkdir -m 700 "${postgres_root}/socket"
          echo "AFFECTED_TESTS_POSTGRES_ROOT=${postgres_root}" >> "$GITHUB_ENV"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          "$PG_BIN/initdb" -D "${postgres_root}/data" -U postgres --auth=trust --encoding=UTF8 --no-locale
          if ! "$PG_BIN/pg_ctl" -D "${postgres_root}/data" -l "${postgres_root}/postgres.log" -w -t 30 \
            -o "-p ${postgres_port} -c listen_addresses=127.0.0.1 -c unix_socket_directories='${postgres_root}/socket'" start; then
            cat "${postgres_root}/postgres.log" >&2 || true
            exit 1
          fi
          {
            echo "CONTROL_ROOM_PG17_UPGRADE_REHEARSAL=1"
            echo "CONTROL_ROOM_PG_CONCURRENCY_GATE=1"
            echo "CONTROL_ROOM_TEST_PG_URL_A=postgresql://postgres@127.0.0.1:${postgres_port}/postgres"
            echo "CONTROL_ROOM_TEST_PG_URL_B=postgresql://postgres@127.0.0.1:${postgres_port}/postgres"
          } >> "$GITHUB_ENV"
      - name: Run tests affected by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm exec --yes --package=squawk-cli@2.61.0 -- pnpm test:affected -- "${BASE_SHA:-HEAD^}"
      - name: Stop disposable PostgreSQL for selected database tests
        if: ${{ always() && steps.selection.outputs.needs-pg == 'true' }}
        run: |
          set -euo pipefail
          "$PG_BIN/pg_ctl" -D "${AFFECTED_TESTS_POSTGRES_ROOT}/data" -m fast -w -t 30 stop || true
          rm -rf -- "${AFFECTED_TESTS_POSTGRES_ROOT}"
          rm -rf -- "${CONTROL_ROOM_PG17_UPGRADE_FIXTURE_ROOT}"

  route:
    name: Route changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      quick: ${{ steps.route.outputs.quick }}
      demo: ${{ steps.route.outputs.demo }}
      server: ${{ steps.route.outputs.server }}
      components: ${{ steps.route.outputs.components }}
      articles: ${{ steps.route.outputs.articles }}
      full: ${{ steps.route.outputs.full }}
      classes: ${{ steps.route.outputs.classes }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The merge base has to be present for a three-dot diff against the base
          # branch, and a shallow clone does not contain it.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Diagnostics go to the log, never to disk, and no credential is written.
      - name: Map this pull request to a lane set
        id: route
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ]; then
            # A push to main or a manual dispatch has no pull-request base. An
            # unreadable diff routes to the complete suite by design.
            echo "No pull-request base revision; the complete suite is required." >&2
            : > /tmp/changed-paths.txt
          else
            git fetch --no-tags --quiet origin "${BASE_REF}"
            git diff --name-status "origin/${BASE_REF}...HEAD" > /tmp/changed-paths.txt
            echo "Changed paths:" >&2
            cat /tmp/changed-paths.txt >&2
          fi
          node scripts/ci-path-routing.mjs /tmp/changed-paths.txt
      - name: Summarise the routing decision
        # Every value reaches the shell as an environment variable. The outputs are
        # derived from the changed-path list, so a crafted file name must never be
        # interpolated into a command line: `${{ }}` inside `run:` would execute it.
        env:
          CLASSES: ${{ steps.route.outputs.classes }}
          FULL: ${{ steps.route.outputs.full }}
          DEMO: ${{ steps.route.outputs.demo }}
          SERVER: ${{ steps.route.outputs.server }}
          COMPONENTS: ${{ steps.route.outputs.components }}
          ARTICLES: ${{ steps.route.outputs.articles }}
          REASON: ${{ steps.route.outputs.reason }}
        run: |
          echo "routing reason: ${REASON}"
          {
            echo "### Changed-path routing"
            echo ""
            echo "- Classes: \`${CLASSES}\`"
            echo "- Complete suite required: \`${FULL}\`"
            echo "- Lanes run early: \`demo=${DEMO} server=${SERVER} components=${COMPONENTS} articles=${ARTICLES}\`"
            echo ""
            echo "Every lane not run early is run by \`full-gate\`, so the complete suite still runs before merge."
          } >> "$GITHUB_STEP_SUMMARY"

  mutation-checks:
    name: Mutation checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find this branch's mutation manifest
        id: manifest
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch="${HEAD_REF:-${REF_NAME}}"
          manifest="mutation-checks/${branch//\//-}.json"
          echo "path=${manifest}" >> "$GITHUB_OUTPUT"
          if [ -e "${manifest}" ] || [ -L "${manifest}" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.manifest.outputs.exists == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install the frozen dependency graph
        if: steps.manifest.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Re-run declared guard mutations
        if: steps.manifest.outputs.exists == 'true'
        env:
          MANIFEST: ${{ steps.manifest.outputs.path }}
        run: node scripts/ci/verify-mutation-checks.mjs "$MANIFEST"
      - name: Warn about guard-like changes without a manifest
        if: steps.manifest.outputs.exists != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci/verify-mutation-checks.mjs --warn-only

  pr-claims:
    name: PR evidence claims
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate claims against head-tree evidence
        run: node scripts/ci/check-pr-claims.mjs

  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # These five need no dependencies, so they report in seconds, before the
      # install that the type checks require.
      - name: Test the lane coverage checker and the path routing
        # The quarantine wrapper delegates the original invocation after applying
        # its exact-name exclusions: node --test tests/check-test-lane-coverage.test.mjs
        run: node scripts/run-tests-with-quarantine.mjs --test tests/check-test-lane-coverage.test.mjs tests/ci-path-routing.test.mjs tests/private-name-guard.test.mjs tests/migration-number-check.test.mjs tests/verify-mutation-checks.test.mjs
      - name: Test the PR evidence claims checker
        run: node --test tests/check-pr-claims.test.mjs
      - name: Test the affected-test planner
        run: node --test tests/affected-tests.test.mjs
      - name: Fail if any test file is unreachable from GitHub Actions
        run: node scripts/check-test-lane-coverage.mjs
      - name: Reject stale or incomplete test quarantines
        run: node scripts/check-test-quarantine.mjs
      # Refuse two migrations with the same 4-digit number, before the private-name
      # step. Migrations are applied in filename order, so two files sharing a number
      # have an order but no intent, and two pull requests can each be correct against
      # main and wrong together. It reads the directory the applier reads and needs no
      # PostgreSQL, so it belongs in the job that reports in seconds. It runs before
      # the private-name step because that step fails closed while the denylist secret
      # is unset, and a failing step skips the rest of the job: putting this one first
      # means its verdict is always reported rather than hidden behind that failure.
      - name: Refuse two migrations with the same 4-digit number
        run: node scripts/ci/check-migration-numbers.mjs
      - name: Reject configured private names
        # The guard fails closed when this repository's run has no list, and skips only
        # for a fork pull request or a local run, so an unconfigured secret cannot pass
        # as a clean scan. It needs no privileges beyond the secret it already had, and
        # reading the event payload costs no budget. While the secret is unset this step
        # fails, which is the guard working: the denylist must be set for this to go green.
        env:
          CONTROL_ROOM_PRIVATE_NAMES: ${{ secrets.CONTROL_ROOM_PRIVATE_NAMES }}
        run: node scripts/check-private-names.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test the owner review readiness helper
        run: node scripts/run-tests-with-quarantine.mjs --import tsx --test tests/browser/owner-review-readiness.test.ts
      # The privileged-routine search_path gate does NOT run here. It used to:
      # it read migration files as text, needed no PostgreSQL, and every
      # review round found a way to fool it (a cross-file ALTER FUNCTION, a
      # later SET/RESET, a nested comment, a quoted identifier). A regex model of
      # PostgreSQL SQL cannot be made sound. It is now a CATALOG gate and runs in
      # the attack-kit lane below, which already installs PostgreSQL 17, so it
      # costs no extra job. The text scanner survives only as a local hint.
      - name: Test hygiene guards
        run: pnpm run test:hygiene
      - name: Type check contributor demo
        run: pnpm run check:demo
      - name: Type check server build
        run: pnpm run check

  test-demo:
    name: Contributor demo tests
    needs: route
    # Routing may narrow work, never drop it: whatever is skipped here is run by
    # full-gate. The status function matters: without it a job-level if: inherits an
    # implicit success() of its dependencies, so a failed or cancelled route job would
    # skip this lane. !cancelled() keeps the lane running after a routing failure while
    # still respecting cancellation of a superseded run.
    if: ${{ !cancelled() && (needs.route.result != 'success' || needs.route.outputs.demo != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Demo tests
        run: pnpm run test:demo
      - name: Demo build test
        run: pnpm run test:build:demo

  test-server:
    name: Server build tests
    needs: route
    if: ${{ !cancelled() && (needs.route.result != 'success' || needs.route.outputs.server != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The `test` script builds the server bundle first, so this covers the
      # build as well and there is no separate build job.
      - name: Build and test
        run: pnpm run test
      - name: Built Mac-local navigation
        run: pnpm run test:built-mac-local-navigation

  test-components:
    name: Component lanes
    needs: route
    if: ${{ !cancelled() && (needs.route.result != 'success' || needs.route.outputs.components != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # PostgreSQL 17 for the postgres-production operator tests (chained into
      # test:components). ASCII-armored key: modern apt reads .asc directly,
      # never through gpg --dearmor (which can block on /dev/tty).
      - name: Install PostgreSQL 17 from PGDG
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --silent --show-error --location --output /tmp/pgdg.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          test -s /tmp/pgdg.asc
          head -1 /tmp/pgdg.asc | grep -q "BEGIN PGP PUBLIC KEY BLOCK"
          sudo cp /tmp/pgdg.asc /etc/apt/keyrings/pgdg.asc
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release --short --codename)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17
      # Chains contracts, product shell, notices, database, queue, codex
      # recovery, access, owner signing, checkpoints, ideas, results, articles,
      # calendar, observations, workspaces, native fences, release licenses and
      # the build profile. These cover the security boundaries the
      # configuration contract commits to; none of them ran in CI before.
      - name: Runtime-assembly memory guard
        run: pnpm run test:private-local-runtime-assembly:memory-guard
      - name: Mac-local real-page journey
        run: pnpm run test:mac-local-real-pages
      - name: Phase 2B contracts
        run: pnpm run test:phase2b
      - name: Component lanes
        run: pnpm run test:components
      # The shared attack-test kit and its own tests. This lane installs
      # PostgreSQL 17 above, so the kit's real-cluster tests must run here
      # rather than skip: tests/attack-kit.test.ts calls
      # requiresRealPostgres() and FAILS when the binaries are present but the
      # cluster tests did not run, so a lost PG install cannot pass silently.
      #
      # The search_path GATE runs here too, and before the kit's own tests, so
      # a migration that introduces an unpinned privileged routine is reported
      # as a gate failure in the job that already owns PostgreSQL 17. The gate
      # builds its own disposable cluster from db/migrations/ plus the role
      # files and reads pg_proc, so it adds seconds, not a second 10-minute job.
      - name: Fail on a privileged routine without a pg_temp-pinned search_path
        run: node --import tsx scripts/check-migration-search-path.mjs
      - name: Attack-test kit
        run: pnpm run test:attack-kit
      - name: Installation operations mode
        # The owner-facing Pause / Drain / Stop switch, its database guards, the
        # coordinator-backed stop, the Mac-local host composition and the
        # supervisor's machine-health port. It is its own lane because each file
        # builds its own disposable cluster on the reserved 58710-58719 range.
        run: pnpm run test:operations-mode
      - name: Resource-bound connector contracts
        # The wrapper preserves this command's flags/files after filtering:
        # node --import tsx --test tests/resource-bound-native-contract-v2.test.ts tests/resource-bound-codex-contract-v2.test.ts tests/resource-bound-local-start-contract-v2.test.ts
        run: node scripts/run-tests-with-quarantine.mjs --import tsx --test tests/resource-bound-native-contract-v2.test.ts tests/resource-bound-codex-contract-v2.test.ts tests/resource-bound-local-start-contract-v2.test.ts

  test-articles:
    name: Article build lane
    needs: route
    if: ${{ !cancelled() && (needs.route.result != 'success' || needs.route.outputs.articles != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Article build lane
        run: pnpm run test:build:articles

  migration-lint:
    name: New migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject edits to shipped migrations and lint new PostgreSQL 17 migrations
        run: npm exec --yes --package=squawk-cli@2.61.0 -- node scripts/check-migration-changes.mjs --base origin/main

  quarantined-tests:
    name: Quarantined tests (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Report quarantined test results
        run: pnpm run test:quarantined

  test-unified-product:
    name: Unified local and multi-computer product tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Shared topology and installable product lanes
        run: |
          pnpm run test:unified-topology
