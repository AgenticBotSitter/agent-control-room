name: Agent build capsule view
description: Human-readable view of a Codex-authored V2 capsule. This form alone never authorizes work.
title: "[READY][PLATFORM][TIER][CR-BLOCK][CAPSULE-ID] "
labels:
  - work-packet
  - jobber-ready
body:
  - type: markdown
    attributes:
      value: |
        Codex authors this issue from a committed V2 capsule. Agents must not self-assign or start from this form alone. Do not include secrets, tokens, private production data, or mutable artifact URLs. One producer, one isolated branch, and a separate verifier when required.
        Before publishing, replace the title with: `[READY][ANY|MACOS|WINDOWS|LINUX][T0|T1|T2|T3][CR-BLOCK][CAPSULE-ID] summary` and add the `jobber-ready` label.
  - type: input
    id: v2_capsule
    attributes:
      label: V2 capsule marker
      description: Enter exactly Capsule followed by a colon and the committed path in backticks. Capsule status must be ready.
      placeholder: "Capsule: `coordination/agent-build/capsules/CR5D-W1-001.json`"
    validations:
      required: true
  - type: input
    id: integration_marker
    attributes:
      label: Integration marker
      description: Enter exactly Integration followed by a colon and the capsule integration branch in backticks.
      placeholder: "Integration: `integration/cr5d-w1`"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform eligibility
      options:
        - ANY
        - MACOS
        - WINDOWS
        - LINUX
    validations:
      required: true
  - type: textarea
    id: claim_commands
    attributes:
      label: Queue commands
      value: |
        Claim: `/claim <route-id>`
        Untouched return: `/release <route-id> --no-work-started <reason>`
        Blocked handoff: `/blocked <route-id> <reason and evidence reference>`
        Submission: `/submitted <route-id> <pull-request-url>`
    validations:
      required: true
  - type: textarea
    id: required_tools
    attributes:
      label: Required tools and pre-claim completion check
      description: Copy requiredTools and state anything the worker must verify before claiming. Missing tools do not imply install authority.
    validations:
      required: true
  - type: input
    id: cr_block
    attributes:
      label: CR block
      description: Example CR-4D.
    validations:
      required: true
  - type: input
    id: worker_route
    attributes:
      label: Eligible routes and claimants
      description: Copy the capsule route IDs, authorized GitHub logins, qualification state, and concurrency limit. A route chooses itself only through /claim.
    validations:
      required: true
  - type: dropdown
    id: work_mode
    attributes:
      label: Work mode
      options:
        - standard-work
        - platform-validation
        - controlled-effect
        - independent-review
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective, delegation value, and accepted contract
      description: State the exact outcome, why delegation is cheaper or provides otherwise unavailable evidence, and link the controlling schema/specification/ADR.
    validations:
      required: true
  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed paths
      description: List the only repository paths this packet may modify.
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: Forbidden changes and effects
      description: Include live systems, secrets, migrations, dependencies, network effects, and out-of-scope modules as applicable.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs and fixtures
      description: Use immutable repository references or artifact checksums.
    validations:
      required: true
  - type: textarea
    id: base_branch
    attributes:
      label: Immutable product base, integration target, and producer branch
      description: Give the full 40-character product-base commit, integration/<block> target, exact bootstrap fetch if needed, and agent/<route>/<capsule> producer branch.
    validations:
      required: true
  - type: textarea
    id: repair_readiness
    attributes:
      label: Repair or readiness budget
      description: Standard work states focused repair iterations. Platform validation states non-mutating readiness commands/attempts separately from native attempts. Controlled-effect work states stop/retry policy.
    validations:
      required: true
  - type: textarea
    id: environment_boundary
    attributes:
      label: Environment and side-effect boundary
      description: State pre-existing tools, allowed setup/network/temp behavior, native or external effects, cleanup, and exact stop conditions. Missing tools do not imply install authority.
    validations:
      required: true
  - type: textarea
    id: execution_contract
    attributes:
      label: Controlled-effect contract (only for controlled-effect mode)
      description: For controlled-effect mode, paste the validated control-room-work-packet/v1 JSON and its canonical SHA-256. Leave blank for other modes.
      render: json
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: List exact commands, tests, and semantic review conditions.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: Define the pull request, files, reports, or artifact manifest to return.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This packet contains no credentials or private production content.
          required: true
        - label: The worker may not expand scope or merge its own pull request.
          required: true
        - label: Codex/Sol review is required before merge.
          required: true
        - label: The result will use separate implementation and metadata-only commits and will target the capsule's integration branch, never main.
          required: true
        - label: The declared work mode, repair/readiness budget, environment boundary, and stop conditions are proportional to the actual risk.
          required: true
        - label: Controlled-effect mode includes a passing execution-contract validator digest and complete effect/cleanup accounting; other modes do not imitate that ledger.
          required: true
