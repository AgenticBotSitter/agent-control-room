name: Hermes work packet
description: Assign a bounded, reviewable build task to a Hermes or other external worker.
title: "[WORK] "
labels:
  - work-packet
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, tokens, private production data, or mutable artifact URLs. One worker and one isolated branch per packet.
  - type: input
    id: cr_block
    attributes:
      label: CR block
      description: Example CR-4D.
    validations:
      required: true
  - type: input
    id: worker_route
    attributes:
      label: Worker route
      description: Worker ID, machine, harness, and model. Use provisional when not yet qualified.
    validations:
      required: true
  - type: dropdown
    id: task_class
    attributes:
      label: Task class
      options:
        - qualification
        - mechanical
        - bounded_implementation
        - integration_candidate
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective and accepted contract
      description: State the exact outcome and link the controlling schema, specification, or ADR.
    validations:
      required: true
  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed paths
      description: List the only repository paths this packet may modify.
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: Forbidden changes and effects
      description: Include live systems, secrets, migrations, dependencies, network effects, and out-of-scope modules as applicable.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs and fixtures
      description: Use immutable repository references or artifact checksums.
    validations:
      required: true
  - type: textarea
    id: execution_contract
    attributes:
      label: Validated execution contract v1
      description: Paste the exact control-room-work-packet/v1 JSON. It must enumerate setup, effects, counts, retries, diagnostics, cleanup, and independence; include the validator digest below. A prose-only packet is not dispatchable.
      render: json
    validations:
      required: true
  - type: input
    id: contract_digest
    attributes:
      label: Execution-contract SHA-256
      description: Exact digest emitted by skills/control-room-work-packets/scripts/validate_execution_contract.py.
    validations:
      required: true
  - type: textarea
    id: worst_case
    attributes:
      label: Worst-case effect walkthrough
      description: Walk every required step, failure branch, retry, diagnostic, helper, setup action, prompt, and cleanup operation. Show effect IDs and prove the maximum counts cover the worst case.
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: Pre-existing environment requirements
      description: State the required checkout, runtime, dependencies, tools, auth mechanism, and OS context. State STOP behavior for every missing prerequisite; do not rely on workers installing or downloading anything implicitly.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: List exact commands, tests, and semantic review conditions.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: Define the pull request, files, reports, or artifact manifest to return.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This packet contains no credentials or private production content.
          required: true
        - label: The worker may not expand scope or merge its own pull request.
          required: true
        - label: Codex/Sol review is required before merge.
          required: true
        - label: The execution-contract validator passes, every required step maps to effect IDs, and worst-case counts include failures and diagnostics.
          required: true
        - label: Missing tools, prompts, retries, cleanup failures, and unexpected effects stop the packet unless separately budgeted.
          required: true

